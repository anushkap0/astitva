# ASTITVA: local / demo stack. All data is fictional (Nexora Technologies).
name: astitva

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-astitva}:${POSTGRES_PASSWORD:-astitva}@postgres:5432/${POSTGRES_DB:-astitva}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-astitva-jwt-secret-0000000000}
  TOKEN_PEPPER: ${TOKEN_PEPPER:-dev-only-change-me-astitva-pepper}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  LLM_PROVIDER: ${LLM_PROVIDER:-none}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  EXPOSE_DEV_OUTBOX: ${EXPOSE_DEV_OUTBOX:-true}
  # NamoID Hosted Auth (values from your local .env; the secret is never committed)
  NAMOID_ISSUER: ${NAMOID_ISSUER:-}
  NAMOID_CLIENT_ID: ${NAMOID_CLIENT_ID:-}
  NAMOID_CLIENT_SECRET: ${NAMOID_CLIENT_SECRET:-}
  NAMOID_REDIRECT_URI: ${NAMOID_REDIRECT_URI:-http://localhost:8000/api/auth/namoid/callback}
  NAMOID_USER_MAP: ${NAMOID_USER_MAP:-}
  NAMOID_AUTO_PROVISION: ${NAMOID_AUTO_PROVISION:-true}
  NAMOID_ROLE_SYNC: ${NAMOID_ROLE_SYNC:-true}
  NAMOID_ROLES_CLAIM: ${NAMOID_ROLES_CLAIM:-}
  NAMOID_SCOPES: ${NAMOID_SCOPES:-openid profile email}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  # Celery beat runs scheduled jobs in Docker, so the API's in-process scheduler is off
  ENABLE_INPROCESS_SCHEDULER: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astitva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astitva}
      POSTGRES_DB: ${POSTGRES_DB:-astitva}
    volumes: [astitva-pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astitva} -d ${POSTGRES_DB:-astitva}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    image: astitva-backend
    environment:
      <<: *backend-env
      SEED_DEMO: ${SEED_DEMO:-true}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    image: astitva-backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }
    healthcheck: { disable: true }

  beat:
    build: ./backend
    image: astitva-backend
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }
    healthcheck: { disable: true }

  frontend:
    image: astitva-frontend
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  astitva-pgdata:
